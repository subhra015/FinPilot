# FinPilot AI — Virtual Host Configuration (Layer 17)
# Governed by: SECURITY_CHECKLIST.md SEC-04, SEC-07, SEC-14, SEC-15

upstream finpilot_backend {
    server api:8000;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirection (SEC-04)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Safe health check bypass for container orchestration
    location /healthz {
        proxy_pass http://finpilot_backend/healthz;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Hardened Edge Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Certificates (SEC-04)
    ssl_certificate /etc/nginx/certs/finpilot.crt;
    ssl_certificate_key /etc/nginx/certs/finpilot.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Comprehensive Security Headers (SEC-14, SEC-07)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;

    # Client payload bounds (SEC-18)
    client_max_body_size 50M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Rate limiting application
    limit_req zone=api_rate_limit burst=20 nodelay;
    limit_conn addr_conn_limit 20;

    # Static Frontend Assets
    location / {
        proxy_pass http://finpilot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # API Proxy with WebSocket / Event-Stream pass-through
    location /api/ {
        proxy_pass http://finpilot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
