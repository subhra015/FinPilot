# ==============================================================================
# FinPilot AI — Production-Ready Orchestration (docker-compose.yml)
#
# Governed by:
# - SECURITY_CHECKLIST.md SEC-02, SEC-03, SEC-04, SEC-14, SEC-20
# - Layer 17 Deployment Hardening & Isolation
# ==============================================================================

version: "3.8"

networks:
  finpilot_net:
    driver: bridge
    ipam:
      driver: default

volumes:
  finpilot_storage:
    name: finpilot_storage_data

services:
  # ----------------------------------------------------------------------------
  # FinPilot Backend & Application Server
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finpilot-ai:1.0.0
    container_name: finpilot_api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    environment:
      - FINPILOT_APP_ENV=production
      - FINPILOT_DEBUG=false
      - FINPILOT_HOST=0.0.0.0
      - FINPILOT_PORT=8000
      - FINPILOT_LOG_LEVEL=INFO
      - FINPILOT_DOCS_ENABLED=false
      - FINPILOT_SECRET_KEY=${FINPILOT_SECRET_KEY:-default-dev-secret-key-replace-in-production-32c}
      - FINPILOT_DATABASE_URL=${FINPILOT_DATABASE_URL:-sqlite:///./data/finpilot_prod.db}
      - FINPILOT_CORS_ALLOWED_ORIGINS=${FINPILOT_CORS_ALLOWED_ORIGINS:-https://localhost,https://127.0.0.1}
    volumes:
      - finpilot_storage:/app/data:rw
      - /tmp:/tmp:rw
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - finpilot_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Nginx TLS Termination & Reverse Proxy
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: finpilot_proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - /tmp/nginx_cache:/var/cache/nginx:rw
      - /tmp/nginx_pid:/var/run:rw
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finpilot_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
