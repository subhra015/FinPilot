# ==============================================================================
# FinPilot AI — Continuous Integration & Security Pipeline (Layer 17)
#
# Governed by:
# - ACCEPTANCE_GATES.md §Layer 17 Gate
# - SECURITY_CHECKLIST.md SEC-01 through SEC-27
# ==============================================================================

name: FinPilot CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Linting, Static Analysis & Pytest Suite
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install pytest pytest-cov ruff pip-audit

      - name: Run Ruff Linter
        run: |
          ruff check backend/src

      - name: Execute Full Pytest Regression Suite
        env:
          PYTHONPATH: backend/src
          FINPILOT_APP_ENV: test
        run: |
          pytest backend/tests -v --durations=10

  # ----------------------------------------------------------------------------
  # 2. Frontend Typecheck, Lint & Vitest Suite
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Repository Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ----------------------------------------------------------------------------
  # 4. Dependency Vulnerability Auditing (SEC-21)
  # ----------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit Backend Dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e backend/
          pip-audit --desc || true

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev || true

  # ----------------------------------------------------------------------------
  # 5. Documentation & Policy Compliance
  # ----------------------------------------------------------------------------
  doc-and-policy-check:
    name: Documentation & Link Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PowerShell
        run: |
          pwsh scripts/check_docs.ps1

  # ----------------------------------------------------------------------------
  # 6. Container & Compose Config Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config --quiet
